<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VulnRAG — ассистент по уязвимостям</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        max-width: 860px;
        margin: 0 auto;
        padding: 24px 16px 64px;
        line-height: 1.5;
      }
      nav {
        display: flex;
        gap: 8px;
        margin: 16px 0 24px;
      }
      nav button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #888;
        border-radius: 6px;
        background: transparent;
      }
      nav button.active {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      textarea,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font: inherit;
        border: 1px solid #888;
        border-radius: 6px;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .counter {
        font-size: 12px;
        color: #666;
        text-align: right;
        margin-top: 4px;
      }
      button.primary {
        margin-top: 12px;
        padding: 10px 22px;
        font-size: 15px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .error {
        color: #dc2626;
        background: #fee2e2;
        padding: 10px 12px;
        border-radius: 6px;
        margin-top: 12px;
      }
      .result {
        margin-top: 20px;
        white-space: pre-wrap;
      }
      .source {
        border: 1px solid #888;
        border-radius: 6px;
        padding: 10px 12px;
        margin-top: 8px;
      }
      .meta {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
