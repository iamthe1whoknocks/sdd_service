# VulnRAG stack: postgres + pgvector, ollama, migrate, app (Go), web (nginx).
# All defaults can be overridden via .env (see .env.example).
#
# Startup chain:
#   postgres (healthy) -> migrate (completed) -> app (after DB, migrations and ollama)
#   ollama (healthy)   ------------------------> app -> web

name: vulnrag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnrag}
      POSTGRES_DB: ${POSTGRES_DB:-vulnrag}
    # RAM limit: 16 GB laptop, keep DB modest
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnrag} -d ${POSTGRES_DB:-vulnrag}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Applies migrations from ./migrations once and exits
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vulnrag}:${POSTGRES_PASSWORD:-vulnrag}@postgres:5432/${POSTGRES_DB:-vulnrag}?sslmode=disable
    volumes:
      - ./migrations:/migrations
    # JSON-array command has no shell, so compose substitutes the URL itself
    # (values come from .env / host environment variables)
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-vulnrag}:${POSTGRES_PASSWORD:-vulnrag}@postgres:5432/${POSTGRES_DB:-vulnrag}?sslmode=disable"
      - "up"
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    environment:
      # Limits for 16 GB RAM: one model in memory, one parallel request
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-paraphrase-multilingual}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    # Honest healthcheck: considered healthy only once the LLM model is pulled.
    # The ollama image has no curl, so we use `ollama list` (the CLI talks to
    # the local API itself). First pull ~2 GB may take up to 30 minutes
    # (interval 15s * retries 120).
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"${OLLAMA_LLM_MODEL:-qwen2.5:3b}\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vulnrag}:${POSTGRES_PASSWORD:-vulnrag}@postgres:5432/${POSTGRES_DB:-vulnrag}?sslmode=disable
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.70}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Defined here (not in Dockerfile) so interval/timeout can be tuned
    # without rebuilding the image. curl is present in the runtime image (alpine).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Default 8088: host port 80 is taken by system nginx/apache;
      # override via WEB_PORT in .env
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
  ollama-models: