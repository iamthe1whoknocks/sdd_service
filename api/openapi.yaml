openapi: 3.1.0
info:
  title: VulnRAG API
  version: 0.1.0
  description: RAG-ассистент по открытым источникам об уязвимостях
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Проверка живости сервиса
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/ask:
    post:
      summary: Задать вопрос об уязвимости
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Ответ ассистента с источниками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '422':
          description: Пустой или слишком длинный вопрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Таймаут генерации (60 с)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/documents:
    post:
      summary: Загрузить документ в RAG-хранилище
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: Документ принят и проиндексирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '413':
          description: content превышает 1 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Некорректный payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AskRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
    Source:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
          nullable: true
        snippet:
          type: string
    AskResponse:
      type: object
      required:
        - answer
        - sources
      properties:
        answer:
          type: string
        sources:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Source'
    DocumentRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        content:
          type: string
          minLength: 1
          # Byte limit enforced by echo middleware (BodyLimit) and ValidateContentSize.
          # Server returns 413 if body exceeds ~1 MB + overhead (not a schema constraint).
    DocumentResponse:
      type: object
      required:
        - document_id
        - indexed
      properties:
        document_id:
          type: string
          format: uuid
        indexed:
          type: boolean
          const: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            detail:
              type: string