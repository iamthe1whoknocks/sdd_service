# nginx для VulnRAG: статика SPA + прокси API на app:8080.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback для client-side роутинга
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: проксируем все запросы /api/* на Go-приложение
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Генерация /ask может длиться до 60 с (таймаут спеки) + запас
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        client_max_body_size 2m;
    }

    # Healthcheck-эндпоинт тоже проксируем (полезно из браузера)
    location = /health {
        proxy_pass http://app:8080/health;
        proxy_set_header Host $host;
    }
}